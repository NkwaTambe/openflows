# .github/workflows/harness-publish.yml
# Builds openflows-harness and publishes it to GitHub Releases on every push to main.
#
# Two tracks:
#   - harness-edge  : updated on every main push  (pre-release label, auto-replaces assets)
#   - stable releases: the harness standalone is also uploaded to tagged feature releases
#                     (see release.yml — uploads directly to the feature release there)
#
# URLs templates use:
#   SIMPLE:   harness-edge pre-release Attached Assets
#   PROD:     {tag}/openflows-harness-x86_64-unknown-linux-musl   (standalone asset, included in tagged releases)
#
# The standalone asset naming convention mirrors the install URL:
#   openflows-harness-{version}-{target}  (e.g. openflows-harness-v1.2.0-x86_64-unknown-linux-musl)

name: Publish Harness

on:
  push:
    branches:
      - main
    tags-ignore:
      # Stable feature releases are handled by release.yml which uploads the
      # harness as a standalone asset plus the full suite tarballs. Skipping
      # tagged pushes here prevents double-upload attempts (GitHub would reject
      # a second upload of the same asset name via gh CLI).
      - 'v[0-9]*.[0-9]*.[0-9]*'
      # Only pre-release dev tags on main would re-trigger, which is fine —
      # both workflows upload the same harness with the same predictable name
      # and GitHub's --clobber handles the replacement.
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip build step (upload only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: harness-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha8: ${{ steps.version.outputs.sha8 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          # Track how many commits since the last stable tag on main
          LAST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname \
            | grep -v -- '-dev\.' | head -1 || echo "")
          if [ -z "$LAST_TAG" ]; then LAST_TAG="v0.0.0"; fi
          LAST_VERSION="${LAST_TAG#v}"
          COMMIT_COUNT=$(git rev-list --count "${LAST_TAG}..HEAD" 2>/dev/null || echo "0")
          SHA8=$(git rev-parse --short HEAD)
          VERSION="v${LAST_VERSION}-dev.${COMMIT_COUNT}.${SHA8}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha8=${SHA8}" >> "$GITHUB_OUTPUT"
          echo "Resolved harness-edge version: ${VERSION}"

  build:
    name: Build Harness
    runs-on: ubuntu-latest
    needs: resolve-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: x86_64-unknown-linux-musl

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libssl-dev pkg-config

      - name: Build harness
        run: >
          cargo build --release
          --target x86_64-unknown-linux-musl
          -p openflows-harness

      - name: Build Go-based binaries (optional — not needed for harness-only)
        run: |
          # Only needed if other suite binaries are ever needed here.
          # Keeping this section for future extension.
          true

      - name: Create standalone harness tarball
        run: |
          mkdir -p dist
          cp "target/x86_64-unknown-linux-musl/release/openflows-harness" "dist/"
          chmod +x "dist/openflows-harness"

          # PREDICTABLE fixed asset name — same for every upload. GitHub's --clobber
          # replaces the previous asset on each publish, so no need to delete old assets.
          mkdir -p "dist/_harness_tmp"
          cp "dist/openflows-harness" "dist/_harness_tmp/"
          tar -czf "dist/openflows-harness-x86_64-unknown-linux-musl.tar.gz" \
            -C dist "_harness_tmp/openflows-harness"
          rm -rf "dist/_harness_tmp"

          # Shared job output so publish-edge can reference the asset name without
          # needing a separate "set output" step.
          echo "asset_name=openflows-harness-x86_64-unknown-linux-musl.tar.gz" \
            >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: harness-build
          path: dist/*
          retention-days: 3

  # ── Publish to harness-edge pre-release ──────────────────────────────────
  # This pre-release is the "edge channel" for workspace templates that don't
  # pin to a specific version. Every main push overwrites the previous asset.
  publish-edge:
    name: Publish Edge
    runs-on: ubuntu-latest
    needs: [resolve-version, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: harness-build
          path: dist/

      - name: Find or create harness-edge release
        id: edge-release
        run: |
          EDGE_RELEASE_ID=$(gh release list \
            --repo "${{ github.repository }}" \
            --json id,name \
            -q '.[] | select(.name == "harness-edge") | .id' 2>/dev/null || echo "")

          if [ -n "$EDGE_RELEASE_ID" ]; then
            echo "Found existing harness-edge release: $EDGE_RELEASE_ID"
            echo "release_id=$EDGE_RELEASE_ID" >> "$GITHUB_OUTPUT"
          else
            echo "Creating new harness-edge release..."
            gh release create "harness-edge" \
              --repo "${{ github.repository }}" \
              --title "Harness Edge (latest build from main)" \
              --notes "Automatically updated on every push to main. This is a pre-release build of openflows-harness and may be unstable. For production, use a tagged feature release." \
              --prerelease
            EDGE_RELEASE_ID=$(gh release view "harness-edge" \
              --json id \
              -q '.id')
            echo "release_id=$EDGE_RELEASE_ID" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload harness tarball to harness-edge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fixed asset name — same for every upload. --clobber auto-replaces prior asset.
          ASSET_NAME="openflows-harness-x86_64-unknown-linux-musl.tar.gz"
          cd dist/
          gh release upload "harness-edge" "$ASSET_NAME" \
            --repo "${{ github.repository }}" \
            --clobber
          sha256sum "$ASSET_NAME" > "${ASSET_NAME}.sha256"
          gh release upload "harness-edge" "${ASSET_NAME}.sha256" \
            --repo "${{ github.repository }}" \
            --clobber

          echo ""
          echo "Published harness-edge assets:"
          gh release view "harness-edge" --json assets \
            -q '.assets[] | "\(.name)\t\(.size) bytes"'

      - name: Output edge asset info
        run: |
          echo ""
          echo "Harness Edge URL:"
          echo "  https://github.com/${{ github.repository }}/releases/download/harness-edge/openflows-harness-x86_64-unknown-linux-musl.tar.gz"
          echo ""
          echo "(Auto-updated on every main push via --clobber upload.)"