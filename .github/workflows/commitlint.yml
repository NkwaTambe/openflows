name: Conventional Commits

# Enforces Conventional Commits on every PR (both the PR title and each commit
# message). This is what feeds release-plz's automatic version computation and
# CHANGELOG generation, so keeping messages conventional guarantees meaningful
# releases: `feat:` → minor, `fix:` → patch, `BREAKING CHANGE:` → major.

on:
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@6cf16efdf4da5277c791d335142c03a0bdf1766e # v6.2.1
        with:
          configFile: commitlint.config.mjs

      # commitlint-github-action only checks commit messages, not the PR title.
      # Lint the title separately against the same conventional ruleset so the
      # "PR title and commit messages are conventional" policy holds. The title
      # is passed via env (not interpolated into the script) to avoid shell
      # injection.
      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" \
            | npx --yes --package commitlint --package '@commitlint/config-conventional' \
                commitlint --config commitlint.config.mjs
