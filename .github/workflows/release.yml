name: Release

# Sole publisher for the two shipped packages (`openflows` binary and
# `openflows-harness`). On every merged release branch to `main`, release-plz:
#   - bumps package versions + regenerates the CHANGELOG from Conventional
#     Commits,
#   - creates the `vX.Y.Z` tag,
#   - opens the GitHub Release.
#
# Publications to npm / Homebrew / Docker (GHCR) / crates.io are intentionally
# removed. Cross-platform binary tarballs are attached to the release by
# `release-assets.yml`, which is triggered by the `v*` tag push that release-plz
# creates here.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # `command: release` creates the tag + GitHub release. No
      # CARGO_REGISTRY_TOKEN is configured, so release-plz never publishes to
      # crates.io — it only tags and opens the release.
      - uses: release-plz/action@b11437f8c0e955c306676ceaf8ce8c54eba6004f # v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
