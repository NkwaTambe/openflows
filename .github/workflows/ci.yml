name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  merge_group:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.2
        with:
          inputs: .github/workflows
          collect: workflows
          online-audits: false
          version: 1.29.0
          min-severity: high
          min-confidence: medium
          advanced-security: false
          annotations: true

  cargo-fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  cargo-clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  cargo-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build workspace
        run: cargo build --workspace --all-targets --all-features

  cargo-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e3720000324bf314ab081346108fc3bab8d6b74 # nextest
      - name: Run tests
        run: cargo nextest run --workspace --all-targets --all-features

  cargo-doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Run cargo doc
        run: cargo doc --workspace --no-deps --all-features

  cargo-machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-machete
        uses: taiki-e/install-action@a204b1f75fac0deb6de48efce012ceb27c911814 # cargo-machete
      - name: Run cargo-machete
        run: cargo-machete

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check for typos
        uses: crate-ci/typos@5e38bf262baaf477ca9f241b3a7cd3d277fd7df8 # master

  pr-lint:
    name: PR Lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_EVENT_PULL_REQUEST_TITLE: ${{ github.event.pull_request.title }}
      - name: Check PR template sections
        run: |
          body="${{ github.event.pull_request.body }}"
          missing=""

          # Check for required template sections (case-insensitive)
          if ! echo "$body" | grep -qi "^## Summary"; then
            missing="${missing}Summary, "
          fi
          if ! echo "$body" | grep -qi "^## Changes"; then
            missing="${missing}Changes, "
          fi
          if ! echo "$body" | grep -qi "^## Validation"; then
            missing="${missing}Validation, "
          fi

          if [ -n "$missing" ]; then
            echo "::error::PR is missing required sections: ${missing%, }"
            echo "::error::See template: .github/pull_request_template.md"
            exit 1
          fi
          echo "✓ PR body contains all required sections"
