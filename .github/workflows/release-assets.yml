name: Release Assets

# Builds and attaches the cross-platform binary tarballs to the two per-package
# GitHub Releases that release-plz created (see `release.yml`).
#
# Each of the two released packages gets its OWN super-tag/release:
#   - `openflows-<version>`        -> release "openflows"        -> asset `openflows-<version>-<target>.tar.gz`
#   - `openflows-harness-<version>` -> release "openflows-harness" -> asset `openflows-harness-<version>-<target>.tar.gz`
#
# Tag names carry no `v` prefix. The package owning the tag is derived from the
# tag name (`openflows-` vs `openflows-harness-`), and each run only builds and
# attaches that package's own binaries. Asset names are predictable/fixed so
# re-runs overwrite (never error).

on:
  push:
    tags:
      - 'openflows-[0-9]*.[0-9]*.[0-9]*'
      - 'openflows-harness-[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

concurrency:
  group: release-assets-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.17
            use_zigbuild: true
            zig_url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_zigbuild: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.17
            use_zigbuild: true
            zig_url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
            zig_sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
          - os: macos-latest
            target: x86_64-apple-darwin
            use_zigbuild: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_zigbuild: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}

      - name: Resolve package from tag
        id: pkg
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" == openflows-harness-* ]]; then
            echo "name=openflows-harness" >> "$GITHUB_OUTPUT"
          elif [[ "${REF_NAME}" == openflows-* ]]; then
            echo "name=openflows" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unexpected release tag '${REF_NAME}'"
            exit 1
          fi

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libssl-dev pkg-config
          if [[ "${{ matrix.target }}" == "aarch64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Configure cross-linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"

      # Install the Zig compiler from the official ziglang.org download and
      # verify its SHA-256 against the official digest for this version before
      # using it, and install cargo-zigbuild as a prebuilt binary from GitHub
      # Releases (SHA-256 pinned in the install-action manifest). The toolchain
      # that produces the release artifacts is therefore integrity-checked
      # independently of the checksums generated from those artifacts.
      - name: Install Zig (verified)
        if: matrix.use_zigbuild
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          ARCHIVE="${ZIG_URL##*/}"
          curl -fsSL "$ZIG_URL" -o "$TMP/$ARCHIVE"
          echo "$ZIG_SHA256  $TMP/$ARCHIVE" | sha256sum -c -
          tar -xJf "$TMP/$ARCHIVE" -C "$TMP"
          TOPDIR="$(tar -tf "$TMP/$ARCHIVE" | head -1)"
          sudo mv "$TMP/${TOPDIR%/}" /opt/zig
          echo "/opt/zig" >> "$GITHUB_PATH"
        env:
          ZIG_URL: ${{ matrix.zig_url }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Build binaries
        env:
          PACKAGE: ${{ steps.pkg.outputs.name }}
        run: |
          PLATFORM_TARGET="${{ matrix.use_zigbuild && matrix.zigbuild_target || matrix.target }}"
          if [[ "${PACKAGE}" == "openflows-harness" ]]; then
            ${{ matrix.use_zigbuild && 'cargo zigbuild' || 'cargo build' }} --release \
              --target "${PLATFORM_TARGET}" --bin openflows-harness
          else
            ${{ matrix.use_zigbuild && 'cargo zigbuild' || 'cargo build' }} --release \
              --target "${PLATFORM_TARGET}" --bin openflows --bin openflows-doctor
          fi

      - name: Create tarball
        env:
          PACKAGE: ${{ steps.pkg.outputs.name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          PKG="${PACKAGE}"
          VERSION="${REF_NAME#${PKG}-}"
          PLATFORM="${{ matrix.target }}"
          ARCHIVE="${PKG}-${VERSION}-${PLATFORM}"
          mkdir -p "dist/${ARCHIVE}"

          if [[ "${PKG}" == "openflows-harness" ]]; then
            cp "target/${{ matrix.target }}/release/openflows-harness" "dist/${ARCHIVE}/"
          else
            for bin in openflows openflows-doctor; do
              cp "target/${{ matrix.target }}/release/${bin}" "dist/${ARCHIVE}/"
            done
            cp -r orchestration "dist/${ARCHIVE}/"
            cp README.md LICENSE "dist/${ARCHIVE}/" 2>/dev/null || true
          fi

          tar -czf "dist/${ARCHIVE}.tar.gz" -C dist "${ARCHIVE}"
          cd dist
          sha256sum "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          retention-days: 5

  attach:
    name: Attach assets
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          pattern: binaries-*
          merge-multiple: true

      # `overwrite: true` ensures a re-run of the same tag replaces assets rather
      # than failing on duplicate names (the fixed-name / clobber pattern).
      - name: Upload assets to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
          overwrite: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
